[project]
name = "flux-card"
version = "0.1.0"
description = "Timecard utility using Apple shortcuts and python to track hours on very flexible schedules"
requires-python = ">=3.13"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fluxcard"]

[project.scripts]
flux = "fluxcard.main:main"
fluxcard = "fluxcard.main:main"
